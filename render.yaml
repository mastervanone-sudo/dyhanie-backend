services:
  - type: web
    name: dyhanie-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ALLOW_ORIGIN
        value: https://mastervanone-sudo.github.io
      - key: DB_PATH
        value: /tmp/premium.db
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
