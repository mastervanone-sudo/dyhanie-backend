services:
  - type: web
    name: dyhanie-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ALLOW_ORIGIN
        value: https://mastervanone-sudo.github.io
      - key: REFERRAL_PERCENT
        value: "10"
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: SETUP_TOKEN
        sync: false
      - key: MAX_AUTH_AGE
        value: "86400"
      - key: DATABASE_URL
        sync: false
